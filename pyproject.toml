[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "model-risk-governance"
version = "1.0.0"
description = "Drift attribution, Mondrian conformal abstention and group fairness checks for credit models, with signed certificates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "cryptography>=42",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.0", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7", "pandas>=2.0"]
realdata = ["pandas>=2.0", "xlrd>=2.0.1"]

[project.scripts]
mrmgov = "mrmgov.__main__:main"

[tool.setuptools]
packages = ["mrmgov"]

[tool.setuptools.package-data]
mrmgov = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["mrmgov"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]  # Depends() defaults are FastAPI's idiom; zip(strict=) is style
